[project]
name = "syndrome-hunters-ecc"
version = "0.1.0"
description = "Surface-code decoders written from scratch: space-time union-find, correlated union-find and a hierarchical decoder, benchmarked against PyMatching."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.5.5",
    "stim==1.16.0",
    "sinter==1.16.0",
    "pymatching==2.4.0",
    "matplotlib==3.11.2",
    "numba==0.68.1",
    "networkx==3.7",
    "scipy==1.18.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
